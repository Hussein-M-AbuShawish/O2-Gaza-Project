# رؤوس الكاش فقط — إعدادات البناء تبقى كما هي في لوحة Netlify.
# صور المنيو: المتصفح يحتفظ بها أسبوعاً فلا يعيد طلبها مع كل زيارة.
# (عند تغيير صورة ارفعها باسم جديد، أو انتظر أسبوعاً ليتحدث الكاش)
[[headers]]
  for = "/menu/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
